name: Deploy to AWS Server

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Lint
        working-directory: api
        run: npm run lint

      - name: Test
        working-directory: api
        run: npm test

      - name: Verify image builds
        run: docker build -t node-api ./api

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Using the env variable prevents shell mangling of the key format
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          # Added -T to prevent pseudo-terminal errors and StrictHostKeyChecking for safety
          ssh -T -o StrictHostKeyChecking=accept-new ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e

            # Ensure the directory exists before trying to enter it
            mkdir -p ~/my-backend-stack
            cd ~/my-backend-stack

            if [ ! -d ".git" ]; then
              # Note: If this is a private repo, you may need a PAT for the clone
              git clone https://github.com/${{ github.repository }} .
            else
              git pull origin main
            fi

            # Using sudo might be required depending on your AWS user setup
            docker compose down || true
            docker compose up -d --build
          EOF
